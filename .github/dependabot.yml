version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - '*'
        update-types:
          - major
