name: 'setup-castor'
description: 'Install castor with a static binary'
author: 'Joel Wurtz'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'heart'
  color: 'red'

# Define your inputs here.
inputs:
  version:
    description: 'Castor version to use'
    required: false
    default: 'latest'
  cooldown:
    description:
      'Minimum age of a release before it can be picked when version is
      "latest", as a duration string ("12 hours", "3 days", "1 week"). Set to 0
      to disable.'
    required: false
    default: '3 days'
  token:
    description: 'GitHub Access Token'
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: dist/index.js
